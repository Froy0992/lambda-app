<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>LAMBDA Control de Obras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d2228">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral azul marino en escritorio, barra inferior en celular; tarjetas blancas sobre fondo gris azulado */
:root{
  /* Paleta LAMBDA: grafito ejecutivo + naranja del logo */
  --navy:#1d2228; --navy-2:#2c333c; --navy-fg:#eef0f2; --navy-muted:#a6adb6;
  --teal:#e2711d; --accent:#b4540e; --ink2:#4a525c; --brand:#e8792a;
  --bg:#f1f2f4; --surface:#ffffff; --surface-2:#f6f7f8; --fg:#1b1f24; --muted:#5f6670; --line:#e1e3e7;
  --ok:#1d9a52; --warn:#c98a00; --bad:#d23f3f; --info:#2f74d0; --off:#7a8697;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,24,30,.05),0 4px 14px rgba(20,24,30,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#14181d; --navy-2:#262c34; --bg:#0f1215; --surface:#181c21; --surface-2:#1f242a; --fg:#eceef1; --muted:#9aa2ad; --line:#2b3138;
  --accent:#f39a55; --teal:#f0802f; --ink2:#7d8793; --ok:#3cc177; --warn:#e6ad2e; --bad:#ef6464; --info:#5b9be6; --off:#8b97a8; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --navy:#14181d; --navy-2:#262c34; --bg:#0f1215; --surface:#181c21; --surface-2:#1f242a; --fg:#eceef1; --muted:#9aa2ad; --line:#2b3138;
  --accent:#f39a55; --teal:#f0802f; --ink2:#7d8793; --ok:#3cc177; --warn:#e6ad2e; --bad:#ef6464; --info:#5b9be6; --off:#8b97a8; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;min-height:100%}
/* barra lateral */
.side{width:232px;flex:none;background:var(--navy);color:var(--navy-fg);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));padding-left:env(safe-area-inset-left,0px)}
.brand{padding:22px 18px 18px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-plate{background:#fff;border-radius:8px;padding:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo-plate svg{display:block;width:150px;height:auto}
.mtitle .logo-plate{padding:4px 8px;border-radius:7px;flex:none}
.mtitle .logo-plate svg{width:84px}
.lg-brand .logo-plate{box-shadow:none;padding:0}
.lg-brand .logo-plate svg{width:200px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.1}
.brand small{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--navy-muted)}
.nav{display:flex;flex-direction:column;padding:10px 0;gap:2px;overflow:auto;flex:1}
.nav button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:11px 20px;color:var(--navy-muted);font-size:14.5px;border-left:3px solid transparent}
.nav button:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav button[aria-current="page"]{color:#fff;background:var(--navy-2);border-left-color:var(--teal);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.nav svg{width:20px;height:20px;flex:none}
.side .motto{padding:18px 22px 22px;font-style:italic;color:var(--navy-muted);font-size:13px;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.net{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:6px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;cursor:pointer}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.net.off i{background:var(--warn)}
.user{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user small{display:block;color:var(--muted);font-size:12px}
.mtitle{display:none}

.content{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1400px;width:100%}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.phead h1{font-size:34px;font-weight:700;line-height:1.05}
.phead p{margin:4px 0 0;color:var(--muted);font-size:15px}
.phead .date{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.card-h h2{font-size:19px;font-weight:600}
.card-b{padding:6px 18px 18px}
.link{all:unset;cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:500}
.link:focus-visible{outline:2px solid var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{display:flex;gap:14px;padding:18px}
.kpi .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:24px;height:24px}
.kpi .lb{color:var(--fg);font-size:14.5px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .d{font-size:13px;margin-top:4px;font-weight:600}
.kpi .d small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.up{color:var(--ok)} .down{color:var(--bad)}
.tint-info{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}
.tint-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.tint-bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.tint-teal{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal)}

.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:16px}
.g3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);gap:16px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.p-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.p-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.p-info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}
.p-off{color:var(--off);background:color-mix(in srgb,var(--off) 15%,transparent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn svg{width:18px;height:18px}
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--navy);color:#fff;border:0;display:none;place-items:center;box-shadow:0 6px 18px rgba(20,24,30,.35);cursor:pointer;z-index:25}
.fab svg{width:28px;height:28px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* listas tipo tarjeta (equipos, contratos, personal) */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.item{display:flex;gap:14px;padding:12px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit}
.item:hover{border-color:var(--muted)}
.thumb{width:84px;height:84px;border-radius:10px;background:var(--surface-2);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--muted);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:40px;height:40px}
.item .bd{flex:1;min-width:0}
.item h3{font-size:17px;font-weight:600;line-height:1.2}
.item .cat{color:var(--accent);font-size:12.5px}
.item .meta{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
.item .top-r{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.chev{color:var(--muted);flex:none;width:18px;height:18px}
.bar{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--teal)}

/* ficha */
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.gallery{display:flex;flex-direction:column;gap:10px;padding:14px}
.gal-main{aspect-ratio:4/3;max-width:100%;border-radius:10px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--muted);position:relative;border:1px solid var(--line)}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-main svg{width:90px;height:90px}
.gal-main .cnt{position:absolute;right:10px;bottom:10px;background:rgba(10,20,35,.7);color:#fff;font-size:12px;padding:3px 9px;border-radius:7px}
.gal-th{display:flex;gap:8px;overflow-x:auto}
.gal-th button{all:unset;cursor:pointer;width:72px;height:56px;border-radius:8px;overflow:hidden;border:2px solid transparent;flex:none}
.gal-th button[aria-current="true"]{border-color:var(--accent)}
.gal-th img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:auto 1fr;font-size:14px}
.kv>div{padding:10px 4px;border-bottom:1px solid var(--line)}
.kv>div:nth-child(odd){color:var(--muted);padding-right:18px}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:22px 1fr;gap:12px;position:relative;padding-bottom:16px}
.tl::before{content:"";position:absolute;left:10px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .dot{width:16px;height:16px;border-radius:50%;margin:3px 0 0 3px;position:relative;z-index:1}
.tl .when{color:var(--muted);font-size:12.5px}
.tl b{display:block;font-size:15px;margin:2px 0}
.tl .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.back svg{width:18px;height:18px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ph{overflow:hidden;cursor:pointer}
.ph .im{aspect-ratio:4/3;background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{padding:8px 10px;font-size:12.5px}
.ph .cap small{display:block;color:var(--muted)}

.inv-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface-2);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:center;border:1px solid var(--line)}
.tile svg{width:38px;height:38px;color:var(--teal);flex:none}
.tile b{font-family:var(--f-display);font-size:26px;display:block;line-height:1.1}
.tile small{color:var(--muted)}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--info) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--info) 30%,transparent);font-size:13.5px}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(8,18,32,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:21px}
.modal .mb{padding:16px 20px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted)}
.pv{display:flex;gap:8px;flex-wrap:wrap}
.pv img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:80;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.bnav{display:none}
.sheet .mb{grid-template-columns:repeat(3,1fr)}
.sheet .mb button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:10px;background:var(--surface-2);font-size:13px;text-align:center}
.sheet .mb svg{width:24px;height:24px;color:var(--accent)}

/* chart */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:18px;justify-content:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center}
.dleg{display:flex;flex-direction:column;gap:8px;font-size:13px}
.dleg div{display:grid;grid-template-columns:12px auto;gap:2px 8px;align-items:center}
.dleg i{width:10px;height:10px;border-radius:50%}
.dleg span{grid-column:2;color:var(--muted)}

[hidden]{display:none!important}
body.nofin .fin{display:none!important}
#login{position:fixed;inset:0;z-index:90;background:var(--navy);display:grid;place-items:center;overflow:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{background:var(--surface);border-radius:16px;padding:28px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.login-card .lg-brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--navy);margin-bottom:4px}
:root[data-theme="dark"] .login-card .lg-brand{color:var(--fg)}
.login-card h1{font-size:26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.login-card p{margin:0;color:var(--muted)}
.login-card .err{color:var(--bad);font-size:13px;min-height:1em}
.login-card .btn{width:100%;padding:12px}
.hint-box{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px;line-height:1.7}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0;cursor:pointer}
.ck input{width:18px;height:18px;margin-top:1px;flex:none}
fieldset.perms{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
fieldset.perms legend{font-size:12.5px;color:var(--muted);padding:0 4px}
#userBtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;margin-left:auto;border-radius:10px}
#userBtn:focus-visible{outline:2px solid var(--accent)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3>:last-child{grid-column:1/-1}}
@media (max-width:980px){.g2,.detail{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .side{display:none}
  .top{background:var(--navy);color:#fff;border:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
  .mtitle{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .mtitle b{display:none}

const SUPA_JS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
const SQL=`-- Ejecuta esto una sola vez en Supabase → SQL Editor
create table if not exists registros(

  obra_id text,
  data jsonb,
  deleted boolean not null default false,

  autor text,
  recibido timestamptz not null default now()
);
create index if not exists registros_recibido on registros(recibido);
create or replace function registros_tocar() returns trigger
language plpgsql as $$ begin new.recibido = now(); return new; end $$;
drop trigger if exists t_registros on registros;
create trigger t_registros before insert or update on registros
for each row execute function registros_tocar();
alter table registros enable row level security;
drop policy if exists "equipo" on registros;
create policy "equipo" on registros for all to authenticated using (true) with check (true);
alter publication supabase_realtime add table registros;
insert into storage.buckets(id,name,public) values('documentos','documentos',false) on conflict do nothing;
drop policy if exists "documentos equipo" on storage.objects;
create policy "documentos equipo" on storage.objects for all to authenticated
  using (bucket_id='documentos') with check (bucket_id='documentos');`;
const inClaude=/claude|anthropic|claudeusercontent/.test(location.hostname);
const Sync={cli:null,ch:null,st:'off',msg:'',busy:false,t:null,
  set(st,msg){this.st=st;this.msg=msg||'';updNet();const el=$('#syncSt');if(el)el.outerHTML=stPill();const m=$('#syncMsg');if(m){m.textContent=this.msg;m.parentElement.hidden=!this.msg}},
  ready(){return this.cli&&this.st!=='auth'&&this.st!=='off'&&navigator.onLine},
  load(){if(window.supabase)return Promise.resolve(true);return new Promise(r=>{const s=document.createElement('script');s.src=SUPA_JS;s.onload=()=>r(!!window.supabase);s.onerror=()=>r(false);document.head.appendChild(s)})},
  async start(){const c=S.sync;if(!c.on||!c.url||!c.key)return this.set('off');if(!navigator.onLine)return this.set('sinred');
    this.set('conn');if(!await this.load())return this.set('err','No se pudo cargar el conector. Revisa tu conexión.');
    try{if(!this.cli)this.cli=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,storageKey:'co-auth'}});
      const{data}=await this.cli.auth.getSession();if(!data||!data.session)return this.set('auth');
      this.set('conn');await this.push();await this.pull();this.listen();if(this.st==='conn')this.set('live')}catch(e){this.set('err',e.message||String(e))}},
  async login(email,pw){S.sync.email=email;persist('sync');if(!await this.load())return'No se pudo cargar el conector.';
    try{if(!this.cli)this.cli=window.supabase.createClient(S.sync.url,S.sync.key,{auth:{persistSession:true,storageKey:'co-auth'}});const{error}=await this.cli.auth.signInWithPassword({email,password:pw});if(error)return error.message;await this.start();return''}catch(e){return e.message||String(e)}},
  async logout(){try{if(this.ch)await this.cli.removeChannel(this.ch);if(this.cli)await this.cli.auth.signOut()}catch(e){}this.ch=null;this.set('auth')},
  kick(){clearTimeout(this.t);this.t=setTimeout(()=>{if(this.ready())this.push()},800)},
  async push(){if(this.busy||!this.cli)return;this.busy=true;try{
    for(const it of [...S.cola]){const o=it.del?null:byId(it.col,it.id);
      if(it.col==='documentos'&&o&&o.archivo&&!o.ruta){const b=await fileGet(o.id);if(b){const path=o.id+'/'+o.archivo.normalize('NFD').replace(/[^\w.\-]+/g,'_');const{error}=await this.cli.storage.from('documentos').upload(path,b,{upsert:true,contentType:o.mime||'application/octet-stream'});if(error)throw error;o.ruta=path;persist('documentos')}}
      const row={id:it.id,col:it.col,obra_id:o?(it.col==='obras'?o.id:o.obraId||null):null,data:o,deleted:!o,updated_at:o&&o.upd?o.upd:new Date().toISOString(),autor:S.config.usuario};
      const{error}=await this.cli.from('registros').upsert(row);if(error)throw error;
      S.cola=S.cola.filter(x=>x!==it);persist('cola');updNet()}
  }catch(e){this.set('err',e.message||String(e))}finally{this.busy=false}},
  async pull(){if(!this.cli)return;let changed=false;for(let p=0;p<50;p++){
    const{data,error}=await this.cli.from('registros').select('*').gt('recibido',S.sync.last||'1970-01-01').order('recibido',{ascending:true}).limit(500);
    if(error)throw error;if(!data||!data.length)break;data.forEach(r=>{if(this.merge(r))changed=true;if(r.recibido>(S.sync.last||''))S.sync.last=r.recibido});persist('sync');if(data.length<500)break}
    if(changed){COLS.forEach(persist);render()}},
  merge(r){if(!COLS.includes(r.col))return false;if(S.cola.some(x=>x.col===r.col&&x.id===r.id))return false;const arr=S[r.col];const i=arr.findIndex(x=>x.id===r.id);
    if(r.deleted||!r.data){if(i>=0){arr.splice(i,1);return true}return false}
    if(i>=0){if(arr[i].upd&&arr[i].upd>=(r.data.upd||''))return false;arr[i]=r.data}else arr.unshift(r.data);return true},
  listen(){if(this.ch)return;let t;this.ch=this.cli.channel('registros-obras').on('postgres_changes',{event:'*',schema:'public',table:'registros'},()=>{clearTimeout(t);t=setTimeout(()=>this.pull().catch(e=>this.set('err',e.message)),400)}).subscribe(s=>{if(s==='SUBSCRIBED'&&this.st!=='err')this.set('live');if(s==='CHANNEL_ERROR')this.set('err','Se perdió el canal en tiempo real; se reintentará.')})},
  async fileUrl(o){if(!this.cli||!o.ruta)return null;const{data,error}=await this.cli.storage.from('documentos').createSignedUrl(o.ruta,3600);return error?null:data.signedUrl}
};
function stPill(){const st={off:['Apagada','off'],sinred:['Sin señal','warn'],conn:['Conectando','info'],auth:['Falta iniciar sesión','warn'],live:['En tiempo real','ok'],err:['Con error','bad']}[Sync.st]||['—','off'];return `<span class="pill p-${st[1]}" id="syncSt"><i></i>${st[0]}</span>`}
function updNet(){const n=S.cola.length,on=navigator.onLine,b=$('#net');if(!b)return;b.classList.toggle('off',!on||Sync.st==='err'||Sync.st==='auth');b.classList.toggle('live',on&&Sync.st==='live'&&!n);
  let t;if(!on)t=n?`Sin señal · ${n} por subir`:'Sin señal';else if(Sync.st==='live')t=n?`Subiendo ${n}…`:'En tiempo real';else if(Sync.st==='conn')t='Conectando…';else if(Sync.st==='auth')t='Inicia sesión';else if(Sync.st==='err')t='Revisar sincronización';else t=n?`Solo este dispositivo · ${n}`:'Solo este dispositivo';
  $('#netTxt').textContent=t}

/* ---------- Gráfica de avance (curva S) ---------- */
const CH={};
function sCurve(o){const cs=cortesDe(o.id);if(!cs.length)return `<div class="empty">Registra el primer corte de avance para ver la curva.</div>`;
  const vig=vigente(o)||1;const es=S.estimaciones.filter(e=>e.obraId===o.id&&e.estado!=='devuelta');
  const finAt=f=>es.filter(e=>(e.periodoFin||'')<=f).reduce((a,e)=>a+num(e.importe),0)/vig*100;
  const pts=[{fecha:o.inicio||cs[0].fecha,p:0,r:0,f:0},...cs.map(c=>({fecha:c.fecha,p:num(c.programado),r:num(c.real),f:finAt(c.fecha)}))];
  const W=640,H=250,L=40,R=116,T=14,B=30;const t0=toD(pts[0].fecha).getTime(),t1=Math.max(toD(pts[pts.length-1].fecha).getTime(),t0+864e5);
  const X=f=>L+(toD(f).getTime()-t0)/(t1-t0)*(W-L-R),Y=v=>T+(1-clamp(v,0,100)/100)*(H-T-B);
  const id='ch'+o.id;CH[id]={pts,X,Y,W,H,L,R,T,B};
  const line=k=>pts.map((q,i)=>(i?'L':'M')+X(q.fecha).toFixed(1)+' '+Y(q[k]).toFixed(1)).join(' ');
  const grid=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`).join('');
  const xt=[pts[0],pts[Math.floor(pts.length/2)],pts[pts.length-1]].filter((q,i,a)=>a.indexOf(q)===i).map((q,i,a)=>`<text x="${X(q.fecha)}" y="${H-8}" text-anchor="${i===0?'start':i===a.length-1?'end':'middle'}">${fD(q.fecha)}</text>`).join('');
  const lp=pts[pts.length-1];
  const lab=[['r','Físico real','var(--teal)'],['p','Programado','var(--ink2)'],['f','Financiero','var(--info)']].map(([k,l,c])=>({k,l,c,y:Y(lp[k])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<lab.length;i++)if(lab[i].y-lab[i-1].y<14)lab[i].y=lab[i-1].y+14;
  return `<div class="chartbox" data-chart="${id}"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de avance físico real, programado y financiero">${grid}${xt}
    <path d="${line('p')}" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="${line('f')}" fill="none" stroke="var(--info)" stroke-width="2"/>
    <path d="${line('r')}" fill="none" stroke="var(--teal)" stroke-width="2.5"/>
    ${pts.slice(1).map(q=>`<circle cx="${X(q.fecha)}" cy="${Y(q.r)}" r="4" fill="var(--teal)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    ${lab.map(a=>`<text x="${W-R+8}" y="${a.y+4}" style="fill:var(--fg);font-weight:600">${pct(lp[a.k])}</text><text x="${W-R+44}" y="${a.y+4}">${a.l.split(' ')[0]}</text>`).join('')}
    <line class="hx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" class="hit"/></svg>
    <div class="tip" hidden></div>
    <div class="legend"><span><i style="background:var(--teal)"></i>Físico real</span><span><i style="background:var(--ink2)"></i>Programado</span><span><i style="background:var(--info)"></i>Financiero (estimado)</span></div></div>`}
function bindCharts(){document.querySelectorAll('[data-chart]').forEach(box=>{const c=CH[box.dataset.chart];if(!c)return;const svg=box.querySelector('svg'),hx=svg.querySelector('.hx'),tip=box.querySelector('.tip');
  const mv=ev=>{const r=svg.getBoundingClientRect();const k=c.W/r.width;const x=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)*k;let best=c.pts[0],bd=1e9;c.pts.forEach(q=>{const d=Math.abs(c.X(q.fecha)-x);if(d<bd){bd=d;best=q}});
    const px=c.X(best.fecha);hx.setAttribute('x1',px);hx.setAttribute('x2',px);hx.setAttribute('visibility','visible');
    tip.innerHTML=`<b class="num">${fD(best.fecha)}</b><div><i style="background:var(--teal)"></i>Físico real ${pct(best.r)}</div><div><i style="background:var(--ink2)"></i>Programado ${pct(best.p)}</div><div><i style="background:var(--info)"></i>Financiero ${pct(best.f)}</div>`;tip.hidden=false;
    const left=px/k;tip.style.left=Math.min(Math.max(0,left+12),box.clientWidth-tip.offsetWidth)+'px';tip.style.top='8px'};
  const out=()=>{hx.setAttribute('visibility','hidden');tip.hidden=true};
  const hit=svg.querySelector('.hit');hit.addEventListener('mousemove',mv);hit.addEventListener('touchstart',mv,{passive:true});hit.addEventListener('touchmove',mv,{passive:true});hit.addEventListener('mouseleave',out)})}

let photoBuf=[],fileBuf=null;
function openForm(col,obj,onSave,title,extra=''){const F=FORMS[col];const o={...obj};photoBuf=[...(o.fotos||[])];fileBuf=null;
  const fld=([k,l,t,req,opts,full,hint])=>{const v=o[k]??'';const id='f-'+k;const lab=`<label for="${id}">${l}${req?' *':''}</label>`;let inp;
    if(t==='select')inp=`<select id="${id}" name="${k}">${opts.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}" ${String(v)===String(a)?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
    else if(t==='obra')inp=`<select id="${id}" name="${k}">${obraOpts().map(([a,b])=>`<option value="${a}" ${v===a?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
    else if(t==='list')inp=`<input id="${id}" name="${k}" list="${id}-l" value="${esc(v)}"><datalist id="${id}-l">${opts.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
    else if(t==='textarea')inp=`<textarea id="${id}" name="${k}">${esc(v)}</textarea>`;
    else if(t==='money')inp=`<input id="${id}" name="${k}" inputmode="decimal" value="${v===''?'':esc(v)}" placeholder="0.00">`;
    else if(t==='number')inp=`<input id="${id}" name="${k}" type="number" step="any" value="${esc(v)}">`;
    else if(t==='photos')inp=`<input id="${id}" type="file" accept="image/*" capture="environment" multiple data-photos="1"><div class="pv" id="pv">${photoBuf.map((p,i)=>`<img src="${p}" alt="Foto ${i+1}">`).join('')}</div><span class="hint">Puedes tomar la foto con la cámara o elegirla de la galería.</span>`;
    else if(t==='file')inp=`<input id="${id}" type="file" data-file="1"><span class="hint" id="fileH">${o.archivo?'Actual: '+esc(o.archivo)+'. Elige otro para reemplazarlo.':'Se guarda en este dispositivo y, si está activa la sincronización, en la nube.'}</span>`;
    else if(t==='gps')inp=`<div class="row" style="flex-wrap:nowrap"><input id="${id}" name="${k}" value="${esc(v)}" placeholder="lat, long" style="flex:1"><button type="button" class="btn sm" data-gps="${id}">${ic('pin')}GPS</button></div><span class="hint" id="${id}-h"></span>`;
    else inp=`<input id="${id}" name="${k}" type="${t}" value="${esc(v)}">`;
    return `<div class="fld ${full?'full':''}">${lab}${inp}${hint?`<span class="hint">${hint}</span>`:''}</div>`};
  $('#modalRoot').innerHTML=`<div class="ov" data-close="1"><form class="modal" id="frm" novalidate><div class="mh"><h2>${title||(o.id?'Editar ':'Nueva ')+F.t.toLowerCase()}</h2><button type="button" class="x" data-close="1" aria-label="Cerrar">${ic('close')}</button></div><div class="mb">${F.f.map(fld).join('')}${extra}<div class="fld full"><span class="note" id="frmErr" style="color:var(--bad)"></span></div></div><div class="mf">${o.id?`<button type="button" class="btn danger" id="frmDel" style="margin-right:auto">${ic('trash')}Eliminar</button>`:''}<button type="button" class="btn" data-close="1">Cancelar</button><button class="btn pri">Guardar</button></div></form></div>`;
  const form=$('#frm');
  form.onsubmit=e=>{e.preventDefault();const out={...o};let miss=[];
    F.f.forEach(([k,l,t,req])=>{if(t==='photos'){out.fotos=photoBuf;if(req&&!photoBuf.length)miss.push(l);return}if(t==='file'){if(!o.id&&!fileBuf&&req)miss.push(l);return}const el=form.elements[k];if(!el)return;let v=el.value.trim();if(t==='money'||t==='number')v=v===''?'':num(v);out[k]=v;if(req&&(v===''||v==null))miss.push(l)});
    if(form.elements.acuerdos){out._acuerdos=form.elements.acuerdos.value;out._resp=form.elements.acResp.value;out._fecha=form.elements.acFecha.value}
    if(miss.length){$('#frmErr').textContent='Falta: '+miss.join(', ');return}
    if(fileBuf){out.archivo=fileBuf.name;out.mime=fileBuf.type;out.size=fileBuf.size;out.ruta='';out._blob=fileBuf}
    closeModal();onSave(out)};
  const d=$('#frmDel');if(d)d.onclick=()=>{if(d.dataset.sure){closeModal();onSave(null)}else{d.dataset.sure=1;d.textContent='Toca otra vez para eliminar'}};
  setTimeout(()=>{const f=form.querySelector('input:not([type=file]),textarea');if(f&&matchMedia('(min-width:861px)').matches)f.focus()},30)}
function closeModal(){$('#modalRoot').innerHTML=''}
function compress(file,max=1400){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function confirmDo(msg,fn){$('#modalRoot').innerHTML=`<div class="ov" data-close="1"><div class="modal" style="max-width:440px"><div class="mh"><h2>Confirmar</h2></div><div class="mb" style="grid-template-columns:1fr"><p style="margin:0">${esc(msg)}</p></div><div class="mf"><button class="btn" data-close="1">Cancelar</button><button class="btn pri" id="okBtn">Sí, continuar</button></div></div></div>`;$('#okBtn').onclick=()=>{closeModal();fn()}}

function saver(col,msg,after){return o=>{if(o===null){del(col,lastEdit);render();toast('Eliminado');return}
  if(!o.id)o.id=uid();
  if(col==='documentos'&&o._blob){fileSet(o.id,o._blob);delete o._blob}
  if(col==='bitacora'&&!o.folio){o.folio=Math.max(0,...S.bitacora.filter(b=>b.obraId===o.obraId).map(b=>b.folio||0))+1}
  const ac=o._acuerdos,rp=o._resp,fe=o._fecha;delete o._acuerdos;delete o._resp;delete o._fecha;
  put(col,o);
  if(col==='minutas'&&ac){ac.split('\n').map(s=>s.trim()).filter(Boolean).forEach(t=>put('pendientes',{id:uid(),obraId:o.obraId,minutaId:o.id,origen:'acuerdo',titulo:t.replace(/^[-•*\d.)\s]+/,''),responsable:rp,compromiso:fe,prioridad:'media',estado:'pendiente',notas:''}))}
  if(after)after(o);render();toast(msg)}}

  import:()=>$('#importFile').click(),
  clearDemo:()=>confirmDo('Se borrarán todas las obras de ejemplo y sus registros. ¿Continuar?',()=>{S.obras.filter(o=>o.ejemplo).forEach(o=>delObra(o.id));S.config.ejemplos=false;persist('config');go('panel');toast('Listo, ya puedes registrar tus obras')}),
  reseed:()=>confirmDo('Se agregarán 4 obras de ejemplo y se reemplazará lo que tengas en este dispositivo. ¿Continuar?',()=>{seed();go('panel')}),
  syncOff:()=>{S.sync.on=false;persist('sync');Sync.logout().then(()=>Sync.set('off'));toast('Sincronización apagada')},
  copySql:()=>{try{navigator.clipboard.writeText(SQL).then(()=>toast('Código copiado'),()=>selectSql())}catch(e){selectSql()}},
};
function selectSql(){const r=document.createRange();r.selectNodeContents($('#sqlBox'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Código seleccionado; cópialo con Ctrl+C')}

function showMinuta(m){const ac=S.pendientes.filter(p=>p.minutaId===m.id);
  $('#modalRoot').innerHTML=`<div class="ov" data-close="1"><div class="modal" style="max-width:720px"><div class="mh"><h2>${esc(m.titulo)}</h2><button class="x" data-close="1" aria-label="Cerrar">${ic('close')}</button></div><div class="mb" style="grid-template-columns:1fr"><div class="kv"><div>Obra</div><div style="white-space:normal">${esc(obraTxt(m.obraId))}</div><div>Fecha</div><div class="num">${fDT(m.fecha)}</div><div>Lugar</div><div>${esc(m.lugar||'—')}</div><div>Asistentes</div><div style="white-space:pre-wrap">${esc(m.asistentes||'—')}</div><div>Temas</div><div style="white-space:pre-wrap">${esc(m.temas||'—')}</div></div><h3 style="font-size:18px;margin-top:6px">Acuerdos</h3>${penList(ac,false)}</div><div class="mf"><button class="btn" data-addac="${m.id}">${ic('plus')}Agregar acuerdo</button><button class="btn pri" data-edit="minutas:${m.id}">${ic('edit')}Editar minuta</button></div></div></div>`}
function showEv(x){const fs=x.fotos||[];const g=x.gps&&/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(x.gps.trim())?x.gps.replace(/\s/g,''):'';
  $('#modalRoot').innerHTML=`<div class="ov" data-close="1"><div class="modal" style="max-width:780px"><div class="mh"><h2>${esc(x.concepto||'Evidencia')}</h2><button class="x" data-close="1" aria-label="Cerrar">${ic('close')}</button></div><div class="mb" style="grid-template-columns:1fr">${fs.map(f=>`<img src="${f}" alt="" style="width:100%;border-radius:10px">`).join('')||'<div class="empty">Sin fotos</div>'}<div class="kv"><div>Obra</div><div style="white-space:normal">${esc(obraTxt(x.obraId))}</div><div>Fecha</div><div class="num">${fDT(x.fecha)}</div><div>Ubicación</div><div>${g?`<a href="https://www.google.com/maps?q=${g}" target="_blank" rel="noopener">${esc(x.gps)}</a>`:esc(x.gps||'—')}</div><div>Subió</div><div>${esc(x.por||'—')}</div>${x.nota?`<div>Nota</div><div style="white-space:pre-wrap">${esc(x.nota)}</div>`:''}</div></div><div class="mf"><button class="btn pri" data-edit="evidencias:${x.id}">${ic('edit')}Editar</button></div></div></div>`}
async function showDoc(d){const k=docKind(d);let url=null,blob=await fileGet(d.id);
  if(!blob&&d.ruta&&Sync.ready()){url=await Sync.fileUrl(d);if(url){try{const r=await fetch(url);if(r.ok){blob=await r.blob();fileSet(d.id,blob)}}catch(e){}}}
  if(blob)url=URL.createObjectURL(blob);
  const prev=!url?`<div class="empty">${d.archivo?(d.ruta?'El archivo está en la nube. Conéctate para verlo.':'El archivo no está en este dispositivo.'):'Este registro no tiene archivo adjunto. Edítalo para subir uno.'}</div>`:k[0]==='pdf'?`<iframe class="viewer" src="${url}" title="${esc(d.nombre)}"></iframe>`:k[0]==='img'?`<img src="${url}" alt="" style="width:100%;border-radius:10px">`:`<div class="empty">Vista previa no disponible para este tipo de archivo.</div>`;
  $('#modalRoot').innerHTML=`<div class="ov" data-close="1"><div class="modal" style="max-width:960px"><div class="mh"><h2>${esc(d.nombre)}</h2><button class="x" data-close="1" aria-label="Cerrar">${ic('close')}</button></div><div class="mb" style="grid-template-columns:1fr">${prev}<div class="kv"><div>Tipo</div><div>${esc(d.tipo)}</div><div>Obra</div><div style="white-space:normal">${esc(obraTxt(d.obraId))}</div><div>Fecha</div><div class="num">${fD(d.fecha)}</div><div>Archivo</div><div style="white-space:normal">${esc(d.archivo||'—')}</div>${d.notas?`<div>Notas</div><div style="white-space:pre-wrap">${esc(d.notas)}</div>`:''}</div></div><div class="mf">${url?`<a class="btn" href="${url}" target="_blank" rel="noopener" download="${esc(d.archivo)}">Abrir o descargar</a>`:''}<button class="btn pri" data-edit="documentos:${d.id}">${ic('edit')}Editar</button></div></div></div>`}
function moreSheet(){$('#modalRoot').innerHTML=`<div class="ov" data-close="1"><div class="modal sheet"><div class="mh"><h2>Más</h2><button class="x" data-close="1" aria-label="Cerrar">${ic('close')}</button></div><div class="mb">${NAV.filter(n=>!BNAV.some(b=>b[0]===n[0])).map(([k,l,i])=>`<button data-go="${k}">${ic(i)}${l}</button>`).join('')}</div></div></div>`}
function getGPS(id){const h=$('#'+id+'-h');try{if(!navigator.geolocation)throw 0;h.textContent='Buscando señal GPS…';navigator.geolocation.getCurrentPosition(p=>{$('#'+id).value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);h.textContent=`Precisión aprox. ${Math.round(p.coords.accuracy)} m`},()=>{h.textContent='No se pudo leer el GPS. Revisa el permiso de ubicación o escribe las coordenadas.'},{enableHighAccuracy:true,timeout:15000})}catch(e){h.textContent='Este dispositivo no permite leer el GPS aquí. Escribe las coordenadas.'}}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('[data-close]')&&(t===t.closest('[data-close]')||t.closest('button[data-close]'))){if(t.classList.contains('ov')||t.closest('button[data-close]')){closeModal();return}}
  const g=t.closest('[data-go]');if(g){closeModal();const k=g.dataset.go;if(k==='mas'){moreSheet();return}V.q='';$('#q').value='';go(k);return}
  const tg=t.closest('[data-toggle]');if(tg){const p=byId('pendientes',tg.dataset.toggle);if(p){p.estado=p.estado==='cerrada'?'pendiente':'cerrada';put('pendientes',p);const mm=t.closest('.modal');render();if(mm&&p.minutaId)showMinuta(byId('minutas',p.minutaId));toast(p.estado==='cerrada'?'Marcado como cerrado':'Reabierto')}return}
  const ed=t.closest('[data-edit]');if(ed){const[c,id]=ed.dataset.edit.split(':');closeModal();editRec(c,id);return}
  const ob=t.closest('[data-obra]');if(ob){go('obras',ob.dataset.obra,ob.dataset.tab||'resumen');return}
  const tb=t.closest('[data-tab]');if(tb&&V.view==='obras'&&V.id){V.tab=tb.dataset.tab;render();return}
  const a=t.closest('[data-act]');if(a){ACT[a.dataset.act]&&ACT[a.dataset.act]();return}
  const f=t.closest('[data-f]');if(f){V.f=f.dataset.f;render();return}
  const mi=t.closest('[data-minuta]');if(mi){showMinuta(byId('minutas',mi.dataset.minuta));return}
  const aa=t.closest('[data-addac]');if(aa){const m=byId('minutas',aa.dataset.addac);openForm('pendientes',{obraId:m.obraId,minutaId:m.id,origen:'acuerdo',prioridad:'media',estado:'pendiente',compromiso:addDays(HOY(),7)},saver('pendientes','Acuerdo agregado',()=>setTimeout(()=>showMinuta(m),0)),'Nuevo acuerdo');return}
  const ev=t.closest('[data-ev]');if(ev){showEv(byId('evidencias',ev.dataset.ev));return}
  const dc=t.closest('[data-doc]');if(dc){showDoc(byId('documentos',dc.dataset.doc));return}
  const gp=t.closest('[data-gps]');if(gp){getGPS(gp.dataset.gps);return}
  if(t.closest('#net')){go('config');return}
  if(t.closest('#userBtn')){go('config');return}
  if(t.closest('#fab')){if(V.view==='obras'&&V.id){const m={estimaciones:'newEst',avance:'newAv',pendientes:'newPen',minutas:'newMin',bitacora:'newBit',evidencias:'newEv',documentos:'newDoc'}[V.tab]||'newEv';ACT[m]()}else{const m=FAB[V.view];if(m)ACT[m]()}return}
});
document.addEventListener('change',async ev=>{const t=ev.target;
  if(t.id==='obraFil'){V.obra=t.value;render();return}
  if(t.dataset.photos){for(const f of t.files){const p=await compress(f);if(p)photoBuf.push(p)}$('#pv').innerHTML=photoBuf.map(p=>`<img src="${p}" alt="">`).join('');t.value='';return}
  if(t.dataset.file){fileBuf=t.files[0]||null;if(fileBuf){$('#fileH').textContent=fileBuf.name+' · '+(fileBuf.size/1048576).toFixed(1)+' MB';const n=$('#f-nombre');if(n&&!n.value)n.value=fileBuf.name.replace(/\.[^.]+$/,'')}return}
  if(t.id==='importFile'&&t.files[0]){try{const d=JSON.parse(await t.files[0].text());if(d.app!=='control-obras')throw 0;COLS.forEach(c=>{S[c]=Array.isArray(d[c])?d[c]:[];persist(c);S[c].forEach(x=>queue(c,x.id))});if(d.config){S.config={...S.config,...d.config};persist('config')}go('panel');toast('Respaldo cargado')}catch(e){toast('Ese archivo no es un respaldo de esta app')}t.value=''}
});
document.addEventListener('submit',async ev=>{const f=ev.target;
  if(f.id==='meForm'){ev.preventDefault();S.config.usuario=f.n.value.trim()||'Coordinador';persist('config');render();toast('Guardado')}
  if(f.id==='syncForm'){ev.preventDefault();const url=f.url.value.trim().replace(/\/+$/,''),key=f.key.value.trim(),email=f.email.value.trim(),pw=f.pw.value;const er=$('#syncErr');
    if(!/^https:\/\/.+/.test(url)||!key){er.textContent='Escribe la URL (empieza con https://) y la clave pública de tu proyecto.';return}
    if(url!==S.sync.url||key!==S.sync.key){Sync.cli=null;Sync.ch=null;S.sync.last=''}
    S.sync={...S.sync,url,key,email,on:true};persist('sync');
    if(!navigator.onLine){er.textContent='Sin señal. Se conectará cuando regrese la conexión.';return}
    er.textContent='Conectando…';
    if(pw){const m=await Sync.login(email,pw);if(m){er.textContent='No se pudo iniciar sesión: '+m;return}}else await Sync.start();
    if(Sync.st==='auth')er.textContent='Escribe tu contraseña para iniciar sesión.';else if(Sync.st==='live'||Sync.st==='conn'){COLS.forEach(c=>S[c].forEach(x=>{const ej=x.ejemplo||(byId('obras',x.obraId)||{}).ejemplo;if(!ej&&!S.cola.some(q=>q.col===c&&q.id===x.id))S.cola.push({col:c,id:x.id})}));persist('cola');Sync.kick();toast('Conectado: los cambios se comparten al momento')}}
});
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{V.q=e.target.value;if(V.q.trim()){V.view='buscar';V.id=null;render()}else go('panel')},220)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('online',()=>{updNet();toast('Conexión recuperada');Sync.start()});
window.addEventListener('offline',()=>{Sync.set('sinred');toast('Sin señal: lo que captures se guarda en el dispositivo')});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==V.view&&NAV.some(n=>n[0]===h))go(h)});

/* ---------- Arranque ---------- */
(async function start(){
  await openDB();
  const has=await idbGet('obras');
  if(has===undefined){seed()}else{for(const c of COLS)S[c]=(await idbGet(c))||[];S.config={...S.config,...((await idbGet('config'))||{})};S.cola=(await idbGet('cola'))||[];S.sync={...S.sync,...((await idbGet('sync'))||{})}}
  const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))V.view=h;
  render();updNet();
  if(!inClaude)Sync.start();
  try{if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!inClaude)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
})();
</script>
