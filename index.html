<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Control de Campo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d2228">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral azul marino en escritorio, barra inferior en celular; tarjetas blancas sobre fondo gris azulado */
:root{
  /* Paleta LAMBDA: grafito ejecutivo + naranja del logo */
  --navy:#1d2228; --navy-2:#2c333c; --navy-fg:#eef0f2; --navy-muted:#a6adb6;
  --teal:#e2711d; --accent:#b4540e; --ink2:#4a525c; --brand:#e8792a;
  --bg:#f1f2f4; --surface:#ffffff; --surface-2:#f6f7f8; --fg:#1b1f24; --muted:#5f6670; --line:#e1e3e7;
  --ok:#1d9a52; --warn:#c98a00; --bad:#d23f3f; --info:#2f74d0; --off:#7a8697;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,24,30,.05),0 4px 14px rgba(20,24,30,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#14181d; --navy-2:#262c34; --bg:#0f1215; --surface:#181c21; --surface-2:#1f242a; --fg:#eceef1; --muted:#9aa2ad; --line:#2b3138;
  --accent:#f39a55; --teal:#f0802f; --ink2:#7d8793; --ok:#3cc177; --warn:#e6ad2e; --bad:#ef6464; --info:#5b9be6; --off:#8b97a8; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --navy:#14181d; --navy-2:#262c34; --bg:#0f1215; --surface:#181c21; --surface-2:#1f242a; --fg:#eceef1; --muted:#9aa2ad; --line:#2b3138;
  --accent:#f39a55; --teal:#f0802f; --ink2:#7d8793; --ok:#3cc177; --warn:#e6ad2e; --bad:#ef6464; --info:#5b9be6; --off:#8b97a8; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;min-height:100%}
/* barra lateral */
.side{width:232px;flex:none;background:var(--navy);color:var(--navy-fg);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));padding-left:env(safe-area-inset-left,0px)}
.brand{padding:22px 18px 18px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-plate{background:#fff;border-radius:8px;padding:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo-plate svg{display:block;width:150px;height:auto}
.mtitle .logo-plate{padding:4px 8px;border-radius:7px;flex:none}
.mtitle .logo-plate svg{width:84px}
.lg-brand .logo-plate{box-shadow:none;padding:0}
.lg-brand .logo-plate svg{width:200px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.1}
.brand small{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--navy-muted)}
.nav{display:flex;flex-direction:column;padding:10px 0;gap:2px;overflow:auto;flex:1}
.nav button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:11px 20px;color:var(--navy-muted);font-size:14.5px;border-left:3px solid transparent}
.nav button:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav button[aria-current="page"]{color:#fff;background:var(--navy-2);border-left-color:var(--teal);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.nav svg{width:20px;height:20px;flex:none}
.side .motto{padding:18px 22px 22px;font-style:italic;color:var(--navy-muted);font-size:13px;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.net{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:6px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;cursor:pointer}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.net.off i{background:var(--warn)}
.user{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user small{display:block;color:var(--muted);font-size:12px}
.mtitle{display:none}

.content{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1400px;width:100%}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.phead h1{font-size:34px;font-weight:700;line-height:1.05}
.phead p{margin:4px 0 0;color:var(--muted);font-size:15px}
.phead .date{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.card-h h2{font-size:19px;font-weight:600}
.card-b{padding:6px 18px 18px}
.link{all:unset;cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:500}
.link:focus-visible{outline:2px solid var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{display:flex;gap:14px;padding:18px}
.kpi .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:24px;height:24px}
.kpi .lb{color:var(--fg);font-size:14.5px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .d{font-size:13px;margin-top:4px;font-weight:600}
.kpi .d small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.up{color:var(--ok)} .down{color:var(--bad)}
.tint-info{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}
.tint-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.tint-bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.tint-teal{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal)}

.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:16px}
.g3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);gap:16px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.p-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.p-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.p-info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}
.p-off{color:var(--off);background:color-mix(in srgb,var(--off) 15%,transparent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn svg{width:18px;height:18px}
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--navy);color:#fff;border:0;display:none;place-items:center;box-shadow:0 6px 18px rgba(20,24,30,.35);cursor:pointer;z-index:25}
.fab svg{width:28px;height:28px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* listas tipo tarjeta (equipos, contratos, personal) */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.item{display:flex;gap:14px;padding:12px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit}
.item:hover{border-color:var(--muted)}
.thumb{width:84px;height:84px;border-radius:10px;background:var(--surface-2);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--muted);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:40px;height:40px}
.item .bd{flex:1;min-width:0}
.item h3{font-size:17px;font-weight:600;line-height:1.2}
.item .cat{color:var(--accent);font-size:12.5px}
.item .meta{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
.item .top-r{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.chev{color:var(--muted);flex:none;width:18px;height:18px}
.bar{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--teal)}

/* ficha */
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.gallery{display:flex;flex-direction:column;gap:10px;padding:14px}
.gal-main{aspect-ratio:4/3;max-width:100%;border-radius:10px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--muted);position:relative;border:1px solid var(--line)}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-main svg{width:90px;height:90px}
.gal-main .cnt{position:absolute;right:10px;bottom:10px;background:rgba(10,20,35,.7);color:#fff;font-size:12px;padding:3px 9px;border-radius:7px}
.gal-th{display:flex;gap:8px;overflow-x:auto}
.gal-th button{all:unset;cursor:pointer;width:72px;height:56px;border-radius:8px;overflow:hidden;border:2px solid transparent;flex:none}
.gal-th button[aria-current="true"]{border-color:var(--accent)}
.gal-th img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:auto 1fr;font-size:14px}
.kv>div{padding:10px 4px;border-bottom:1px solid var(--line)}
.kv>div:nth-child(odd){color:var(--muted);padding-right:18px}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:22px 1fr;gap:12px;position:relative;padding-bottom:16px}
.tl::before{content:"";position:absolute;left:10px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .dot{width:16px;height:16px;border-radius:50%;margin:3px 0 0 3px;position:relative;z-index:1}
.tl .when{color:var(--muted);font-size:12.5px}
.tl b{display:block;font-size:15px;margin:2px 0}
.tl .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.back svg{width:18px;height:18px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ph{overflow:hidden;cursor:pointer}
.ph .im{aspect-ratio:4/3;background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{padding:8px 10px;font-size:12.5px}
.ph .cap small{display:block;color:var(--muted)}

.inv-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface-2);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:center;border:1px solid var(--line)}
.tile svg{width:38px;height:38px;color:var(--teal);flex:none}
.tile b{font-family:var(--f-display);font-size:26px;display:block;line-height:1.1}
.tile small{color:var(--muted)}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--info) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--info) 30%,transparent);font-size:13.5px}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(8,18,32,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:21px}
.modal .mb{padding:16px 20px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted)}
.pv{display:flex;gap:8px;flex-wrap:wrap}
.pv img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:80;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.bnav{display:none}
.sheet .mb{grid-template-columns:repeat(3,1fr)}
.sheet .mb button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:10px;background:var(--surface-2);font-size:13px;text-align:center}
.sheet .mb svg{width:24px;height:24px;color:var(--accent)}

/* chart */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:18px;justify-content:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center}
.dleg{display:flex;flex-direction:column;gap:8px;font-size:13px}
.dleg div{display:grid;grid-template-columns:12px auto;gap:2px 8px;align-items:center}
.dleg i{width:10px;height:10px;border-radius:50%}
.dleg span{grid-column:2;color:var(--muted)}

[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:90;background:var(--navy);display:grid;place-items:center;overflow:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{background:var(--surface);border-radius:16px;padding:28px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.login-card .lg-brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--navy);margin-bottom:4px}
:root[data-theme="dark"] .login-card .lg-brand{color:var(--fg)}
.login-card h1{font-size:26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.login-card p{margin:0;color:var(--muted)}
.login-card .err{color:var(--bad);font-size:13px;min-height:1em}
.login-card .btn{width:100%;padding:12px}
.hint-box{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px;line-height:1.7}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0;cursor:pointer}
.ck input{width:18px;height:18px;margin-top:1px;flex:none}
fieldset.perms{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
fieldset.perms legend{font-size:12.5px;color:var(--muted);padding:0 4px}
#userBtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;margin-left:auto;border-radius:10px}
#userBtn:focus-visible{outline:2px solid var(--accent)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3>:last-child{grid-column:1/-1}}
@media (max-width:980px){.g2,.detail{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .side{display:none}
  .top{background:var(--navy);color:#fff;border:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
  .mtitle{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .mtitle b{display:none}
  .mtitle svg{width:30px;height:30px;color:#fff;flex:none}

function barChart(y){
  const W=560,H=250,L=58,B=26,T=10;const ing=[],eg=[];
  for(let m=0;m<12;m++){ing.push(monthSum('ingreso',y,m));eg.push(monthSum('egreso',y,m))}
  const mx=Math.max(...ing,...eg,1);const step=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/(step*2))*step*2||1;
  const ticks=[0,.25,.5,.75,1].map(p=>p*top);const sy=v=>T+(H-T-B)*(1-v/top);const cw=(W-L-6)/12;const bw=Math.min(12,cw/3);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ingresos y egresos por mes">`;
  ticks.forEach(t=>{s+=`<line x1="${L}" x2="${W-4}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${sy(t)+4}" text-anchor="end">${t>=1e6?(t/1e6).toFixed(t%1e6?1:0)+' M':t>=1e3?Math.round(t/1e3)+' k':t}</text>`});
  for(let m=0;m<12;m++){const x=L+m*cw+cw/2;
    if(ing[m])s+=`<rect x="${x-bw-1}" y="${sy(ing[m])}" width="${bw}" height="${sy(0)-sy(ing[m])}" rx="2" fill="var(--teal)"><title>Ingresos ${MESES_L[m]}: ${money(ing[m])}</title></rect>`;
    if(eg[m])s+=`<rect x="${x+1}" y="${sy(eg[m])}" width="${bw}" height="${sy(0)-sy(eg[m])}" rx="2" fill="var(--ink2)"><title>Egresos ${MESES_L[m]}: ${money(eg[m])}</title></rect>`;
    s+=`<text x="${x}" y="${H-8}" text-anchor="middle">${MESES_L[m]}</text>`}
  return s+`</svg><div class="legend"><span><i style="background:var(--teal)"></i>Ingresos (MXN)</span><span><i style="background:var(--ink2)"></i>Egresos (MXN)</span></div>`;
}
function donut(seg,total){
  const R=70,C=2*Math.PI*R;let o=0;let s=`<svg viewBox="0 0 180 180" width="170" height="170" role="img" aria-label="Equipos por estado">`;
  s+=`<circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="26"/>`;
  const t=seg.reduce((a,x)=>a+x.n,0)||1;
  seg.forEach(x=>{if(!x.n)return;const len=x.n/t*C;s+=`<circle cx="90" cy="90" r="${R}" fill="none" stroke="${x.c}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-o}" transform="rotate(-90 90 90)"/>`;o+=len});
  return s+`<text x="90" y="92" text-anchor="middle" font-family="var(--f-display)" font-size="34" font-weight="700" fill="var(--fg)">${total}</text><text x="90" y="114" text-anchor="middle" font-size="13" fill="var(--muted)">equipos</text></svg>`;
}

}

/* ---------- Finanzas ---------- */

  ${L.map(x=>{const c=byId('contratos',x.contratoId);return `<tr class="click" data-edit="finanzas:${x.id}"><td class="num">${fD(x.fecha)}</td><td>${esc(x.concepto)}</td><td>${c?esc(c.numero):'General'}</td><td class="r num ${x.tipo==='ingreso'?'up':'down'}">${x.tipo==='ingreso'?'+':'−'}${money(x.monto)}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">Sin registros</td></tr>'}

/* ---------- Búsqueda ---------- */

function openForm(kind,obj,onSave,title){

    if(type==='select'){const o=typeof opts==='function'?opts():opts;return `<div class="fld${full}"><label for="${id}">${l}${req?' *':''}</label><select id="${id}" name="${k}" ${req?'required':''}>${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v??'')?'selected':''}>${esc(b)}</option>`).join('')}</select></div>`}
    if(type==='textarea')return `<div class="fld full"><label for="${id}">${l}</label><textarea id="${id}" name="${k}">${esc(v)}</textarea></div>`;
    if(type==='photos'||type==='photo'){photoBuf[k]=type==='photos'?[...(v||[])]:(v?[v]:[]);return `<div class="fld full"><label for="${id}">${l}${req?' *':''}</label><input id="${id}" type="file" accept="image/*" capture="environment" ${type==='photos'?'multiple':''} data-pf="${k}" data-multi="${type==='photos'?1:0}"><div class="pv" id="pv-${k}">${photoBuf[k].map(p=>`<img src="${p}" alt="">`).join('')}</div><span class="hint">En el celular se abre la cámara. Las fotos se reducen para ocupar poco espacio.</span></div>`}
    if(type==='gps')return `<div class="fld full"><label for="${id}">${l}</label><div class="row"><input id="${id}" name="${k}" value="${esc(v)}" placeholder="Latitud, longitud" style="flex:1"><button type="button" class="btn sm" data-gps="${id}">${ic('pin')}Tomar ubicación</button></div><span class="hint" id="${id}-h">Funciona sin internet; solo necesita el GPS del teléfono.</span></div>`;
    return `<div class="fld${full}"><label for="${id}">${l}${req?' *':''}</label><input id="${id}" name="${k}" type="${type}" value="${esc(v)}" ${req?'required':''} ${type==='number'?'step="any" inputmode="decimal"':''}></div>`};
  $('#modalRoot').innerHTML=`<div class="ov" data-close="1"><form class="modal" id="frm" novalidate><div class="mh"><h2>${title||(isNew?'Nuevo ':'Editar ')+sc.t}</h2><button type="button" class="x" data-close="1" aria-label="Cerrar">${ic('close')}</button></div><div class="mb">${sc.f.map(fld).join('')}<div class="fld full" id="frmErr" style="color:var(--bad)" hidden></div></div><div class="mf">${!isNew&&kind!=='movimiento'&&can('borrar')?`<button type="button" class="btn danger" id="frmDel" style="margin-right:auto">Eliminar</button>`:''}<button type="button" class="btn" data-close="1">Cancelar</button><button type="submit" class="btn pri">Guardar</button></div></form></div>`;
  const frm=$('#frm');
  frm.addEventListener('submit',ev=>{ev.preventDefault();const out={...obj};const miss=[];
    sc.f.forEach(([k,l,type,req])=>{if(type==='photos')out[k]=photoBuf[k];else if(type==='photo')out[k]=photoBuf[k][0]||null;else{let v=frm.elements[k].value;if(type==='number')v=v===''?'':Number(v);if(type==='select'&&v==='')v=null;out[k]=v}
      const has=type==='photos'?out[k].length:type==='photo'?!!out[k]:(out[k]!==''&&out[k]!=null);if(req&&!has)miss.push(l)});
    if(miss.length){const e=$('#frmErr');e.hidden=false;e.textContent='Falta llenar: '+miss.join(', ');return}
    closeModal();onSave(out);});
  const d=$('#frmDel');if(d)d.onclick=()=>{if(d.dataset.sure){closeModal();onSave(null)}else{d.dataset.sure=1;d.textContent='Toca otra vez para eliminar'}};
}

function compress(file,max=1280){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
async function filesToPhotos(files){const out=[];for(const f of files){const p=await compress(f);if(p)out.push(p)}return out}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

async function hashPw(pw,salt){const txt=salt+'|'+String(pw).trim();try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=2166136261;for(const ch of txt){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16)}}
async function mkUser(nombre,usuario,pw,rol,extra={}){const salt=uid();return {id:uid(),nombre,usuario,salt,hash:await hashPw(pw,salt),rol,permisos:[...ROLES[rol][2]],activo:true,creado:new Date().toISOString(),...extra}}

function applyPerms(root){
  root.querySelectorAll('[data-act]').forEach(el=>{const p=ACT_PERM[el.dataset.act];if(p&&!can(p))el.remove()});
  root.querySelectorAll('[data-edit]').forEach(el=>{const col=el.dataset.edit.split(':')[0];if(!can(col==='finanzas'?'finanzas':'editar')){el.removeAttribute('data-edit');el.classList.remove('click');if(el.tagName==='BUTTON')el.replaceWith(document.createTextNode(el.textContent))}});
  if(!can('movimientos'))root.querySelectorAll('[data-qty],[data-done]').forEach(el=>el.remove());
  if(!can('evidencia'))root.querySelectorAll('input[data-addphoto]').forEach(el=>el.closest('label').remove());
  if(!can('editar'))root.querySelectorAll('input[data-trphoto]').forEach(el=>el.closest('label').remove());
}

  ${S.usuarios.map(x=>`<tr class="click" data-user="${x.id}"><td><b>${esc(x.nombre)}</b>${x.id===U.id?' <span class="pill p-off">Tú</span>':''}</td><td class="mono">${esc(x.usuario)}</td><td>${rolPill(x.rol)}</td><td style="white-space:normal;min-width:220px;color:var(--muted)">${PERMS.filter(([k])=>(x.permisos||[]).includes(k)).map(p=>p[2]).join(' · ')||'Solo consulta'}</td><td>${x.activo===false?'<span class="pill p-off"><i></i>Bloqueado</span>':'<span class="pill p-ok"><i></i>Activo</span>'}</td><td class="num">${fecha(x)}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="card"><div class="card-h"><h2>Qué puede hacer cada rol</h2></div><div class="tbl-wrap"><table><thead><tr><th>Permiso</th>${Object.values(ROLES).map(r=>`<th>${r[0]}</th>`).join('')}</tr></thead><tbody>${PERMS.map(([k,l])=>`<tr><td>${l}</td>${Object.values(ROLES).map(r=>`<td>${r[2].includes(k)?'<b style="color:var(--ok)">Sí</b>':'<span style="color:var(--muted)">No</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="card-b" style="color:var(--muted);font-size:13px;padding-top:12px">Todos pueden consultar la información. Al crear un usuario eliges su rol y después puedes activar o quitar permisos uno por uno.</div></div>`;
}
function userForm(x){
  const isNew=!x;x=x||{rol:'campo',permisos:[...ROLES.campo[2]],activo:true};const self=!isNew&&x.id===U.id;
  $('#modalRoot').innerHTML=`<div class="ov" data-close="1"><form class="modal" id="ufrm" novalidate><div class="mh"><h2>${isNew?'Nuevo usuario':'Editar usuario'}</h2><button type="button" class="x" data-close="1" aria-label="Cerrar">${ic('close')}</button></div><div class="mb">
  <div class="fld"><label for="u-nombre">Nombre *</label><input id="u-nombre" value="${esc(x.nombre||'')}"></div>
  <div class="fld"><label for="u-usuario">Usuario *</label><input id="u-usuario" value="${esc(x.usuario||'')}" autocapitalize="none" autocomplete="off" spellcheck="false"></div>
  <div class="fld"><label for="u-pw">${isNew?'Contraseña *':'Nueva contraseña'}</label><input id="u-pw" type="text" autocomplete="off" autocapitalize="none" placeholder="${isNew?'Mínimo 6 caracteres':'Vacía = no cambia'}"></div>
  <div class="fld"><label for="u-rol">Rol</label><select id="u-rol" ${self?'disabled':''}>${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${x.rol===k?'selected':''}>${r[0]}</option>`).join('')}</select></div>
  <div class="fld full"><label for="u-trab">Es el trabajador (opcional)</label><select id="u-trab"><option value="">Ninguno</option>${S.trabajadores.map(t=>`<option value="${t.id}" ${x.trabajadorId===t.id?'selected':''}>${esc(t.nombre)}</option>`).join('')}</select></div>
  <fieldset class="fld full perms"><legend>Permisos</legend>${PERMS.map(([k,l])=>`<label class="ck"><input type="checkbox" name="perm" value="${k}" ${(x.permisos||[]).includes(k)?'checked':''} ${self&&k==='usuarios'?'disabled':''}>${l}</label>`).join('')}</fieldset>
  <label class="ck fld full"><input type="checkbox" id="u-activo" ${x.activo!==false?'checked':''} ${self?'disabled':''}>Puede entrar a la app</label>
  ${isNew?'':'<div class="fld full hint">Si cambias la contraseña, el usuario verá un aviso para poner una propia.</div>'}
  <div class="fld full" id="uErr" style="color:var(--bad)" hidden></div></div>
  <div class="mf">${!isNew&&!self?'<button type="button" class="btn danger" id="uDel" style="margin-right:auto">Eliminar</button>':''}<button type="button" class="btn" data-close="1">Cancelar</button><button type="submit" class="btn pri">Guardar</button></div></form></div>`;
  $('#u-rol').onchange=e=>{const p=ROLES[e.target.value][2];document.querySelectorAll('#ufrm [name=perm]').forEach(c=>{if(!c.disabled)c.checked=p.includes(c.value)})};
  const err=m=>{const e=$('#uErr');e.hidden=false;e.textContent=m};
  $('#ufrm').onsubmit=async ev=>{ev.preventDefault();const nombre=$('#u-nombre').value.trim(),usuario=$('#u-usuario').value.trim().toLowerCase(),pw=$('#u-pw').value;
    if(!nombre||!usuario)return err('Escribe el nombre y el usuario.');
    if(!/^[a-z0-9._-]{3,}$/.test(usuario))return err('El usuario debe tener al menos 3 letras o números, sin espacios ni acentos.');
    if(S.usuarios.some(z=>z.usuario===usuario&&z.id!==x.id))return err('Ese usuario ya existe. Elige otro.');
    if((isNew||pw)&&pw.length<6)return err('La contraseña debe tener al menos 6 caracteres.');
    const o={...x,nombre,usuario,rol:self?x.rol:$('#u-rol').value,trabajadorId:$('#u-trab').value||null,permisos:[...document.querySelectorAll('#ufrm [name=perm]:checked')].map(c=>c.value),activo:self?true:$('#u-activo').checked};
    if(self&&!o.permisos.includes('usuarios'))o.permisos.push('usuarios');
    if(pw){o.salt=uid();o.hash=await hashPw(pw,o.salt);o.temporal=!self}
    if(isNew){o.id=uid();o.creado=new Date().toISOString();S.usuarios.push(o)}else S.usuarios[S.usuarios.findIndex(z=>z.id===o.id)]=o;
    saveUsers();if(self)U=o;closeModal();render();toast(isNew?'Usuario creado':'Usuario guardado')};
  const d=$('#uDel');if(d)d.onclick=()=>{if(d.dataset.sure){S.usuarios=S.usuarios.filter(z=>z.id!==x.id);saveUsers();closeModal();render();toast('Usuario eliminado')}else{d.dataset.sure=1;d.textContent='Toca otra vez para eliminar'}};
}
function accountSheet(){
  $('#modalRoot').innerHTML=`<div class="ov" data-close="1"><div class="modal" style="max-width:440px"><div class="mh"><h2>Mi cuenta</h2><button class="x" data-close="1" aria-label="Cerrar">${ic('close')}</button></div><div class="mb" style="grid-template-columns:1fr">
  <div class="row"><div class="avatar">${initials(U.nombre)}</div><div><b>${esc(U.nombre)}</b><div class="mono" style="color:var(--muted)">${esc(U.usuario)}</div></div><span style="margin-left:auto">${rolPill(U.rol)}</span></div>
  <div><div style="font-size:12.5px;color:var(--muted);margin-bottom:4px">Puedes consultar todo y además:</div>${PERMS.filter(([k])=>can(k)).map(([,l])=>`<div style="padding:3px 0">✓ ${l}</div>`).join('')||'<div>Solo consulta</div>'}</div></div>
  <div class="mf"><button class="btn" data-act="myPw">Cambiar contraseña</button><button class="btn pri" id="logoutBtn">Cerrar sesión</button></div></div></div>`;
  $('#logoutBtn').onclick=logout;
}
function pwForm(){
  $('#modalRoot').innerHTML=`<div class="ov" data-close="1"><form class="modal" id="pfrm" style="max-width:420px" novalidate><div class="mh"><h2>Cambiar contraseña</h2><button type="button" class="x" data-close="1" aria-label="Cerrar">${ic('close')}</button></div><div class="mb" style="grid-template-columns:1fr">
  <div class="fld"><label for="p-a">Contraseña actual</label><input id="p-a" type="password" autocomplete="current-password"></div>
  <div class="fld"><label for="p-n">Nueva contraseña</label><input id="p-n" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></div>
  <div class="fld"><label for="p-r">Repite la nueva contraseña</label><input id="p-r" type="password" autocomplete="new-password"></div>
  <div class="fld" id="pErr" style="color:var(--bad)" hidden></div></div><div class="mf"><button type="button" class="btn" data-close="1">Cancelar</button><button class="btn pri" type="submit">Guardar</button></div></form></div>`;
  const err=m=>{const e=$('#pErr');e.hidden=false;e.textContent=m};
  $('#pfrm').onsubmit=async e=>{e.preventDefault();if(await hashPw($('#p-a').value,U.salt)!==U.hash)return err('La contraseña actual no es correcta.');const n=$('#p-n').value;if(n.length<6)return err('La nueva contraseña debe tener al menos 6 caracteres.');if(n!==$('#p-r').value)return err('Las dos contraseñas nuevas no coinciden.');
    U.salt=uid();U.hash=await hashPw(n,U.salt);U.temporal=false;saveUsers();closeModal();render();toast('Contraseña cambiada')};
}

/* ---------- Eventos ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.classList.contains('ov')||t.closest('button[data-close]')){closeModal();return}
  if(t.closest('#userBtn')){accountSheet();return}
  const us=t.closest('[data-user]');if(us){if(can('usuarios'))userForm(S.usuarios.find(z=>z.id===us.dataset.user));return}
  const g=t.closest('[data-go]');if(g){if(g.dataset.go==='mas'){moreSheet();return}closeModal();V.q='';$('#q').value='';go(g.dataset.go);return}
  const o=t.closest('[data-open]');if(o){const[v,id]=o.dataset.open.split(':');go(v,id);return}
  const ed=t.closest('[data-edit]');if(ed&&!t.closest('[data-done]')){const[col,id]=ed.dataset.edit.split(':');if(!can(col==='finanzas'?'finanzas':'editar'))return;lastEdit=id;openForm(col,byId(col,id),x=>{if(x===null){del(col,id);render();toast('Eliminado');return}put(col,x);render();toast('Guardado')});return}
  const a=t.closest('[data-act]');if(a&&ACT[a.dataset.act]){const pr=ACT_PERM[a.dataset.act];if(pr&&!can(pr)){toast('No tienes permiso para esto');return}ACT[a.dataset.act](a);return}
  const f=t.closest('[data-f]');if(f){const[k,v]=f.dataset.f.split(':');V.f[k]=v;render();return}
  const tb=t.closest('[data-tab]');if(tb){V.tab=tb.dataset.tab;render();return}
  const gl=t.closest('[data-gal]');if(gl){V.gal=+gl.dataset.gal;render();return}
  const dn=t.closest('[data-done]');if(dn){if(!can('movimientos'))return;const m=byId('mantenimientos',dn.dataset.done);m.estado='realizado';m.fecha=iso(new Date());const e=byId('equipos',m.equipoId);if(e&&e.estatus==='mantenimiento'){e.estatus='disponible';S.movimientos.unshift({id:uid(),equipoId:e.id,tipo:'devolucion',fecha:isoT(new Date()),nota:'Regresa de servicio: '+m.tipo,ubicacion:'Almacén central',persona:m.proveedor||''});e.ubicacion='Almacén central';persist('movimientos');put('equipos',e)}put('mantenimientos',m);render();toast('Servicio marcado como hecho');return}
  const qy=t.closest('[data-qty]');if(qy){if(!can('movimientos'))return;const[id,d]=qy.dataset.qty.split(':');const x=byId('materiales',id);x.cantidad=Math.max(0,Number(x.cantidad||0)+Number(d));put('materiales',x);render();return}
  const ph=t.closest('[data-ev]');if(ph){const x=byId('evidencias',ph.dataset.ev);showEv(x);return}
  const gp=t.closest('[data-gps]');if(gp){getGPS(gp.dataset.gps);return}
  if(t.closest('#net')){go('config');return}
  if(t.closest('#fab')){const m=FAB[V.view];if(m&&can(ACT_PERM[m]))ACT[m]();return}
});
function showEv(x){if(!x)return;$('#modalRoot').innerHTML=`<div class="ov" data-close="1"><div class="modal" style="max-width:760px"><div class="mh"><h2>Evidencia</h2><button class="x" data-close="1" aria-label="Cerrar">${ic('close')}</button></div><div class="mb" style="grid-template-columns:1fr"><img src="${x.foto}" alt="" style="width:100%;border-radius:10px"><div class="kv"><div>Fecha</div><div class="num">${fDT(x.fecha)}</div><div>Ligada a</div><div><button class="link" data-open="${x.refTipo}:${x.refId}">${esc(refName(x.refTipo,x.refId))}</button></div><div>Nota</div><div style="white-space:normal">${esc(x.nota||'—')}</div><div>GPS</div><div class="mono">${esc(x.gps||'—')}</div><div>Subida por</div><div>${esc(x.por||'—')}</div></div></div><div class="mf">${can('borrar')?'<button class="btn danger" id="evDel" style="margin-right:auto">Eliminar</button>':''}<button class="btn" data-close="1">Cerrar</button></div></div></div>`;
  const d=$('#evDel');if(d)d.onclick=()=>{if(d.dataset.sure){del('evidencias',x.id);closeModal();render();toast('Evidencia eliminada')}else{d.dataset.sure=1;d.textContent='Toca otra vez para eliminar'}}}
function getGPS(id){const h=$('#'+id+'-h');try{if(!navigator.geolocation)throw 0;h.textContent='Buscando señal GPS…';navigator.geolocation.getCurrentPosition(p=>{$('#'+id).value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);h.textContent=`Precisión aprox. ${Math.round(p.coords.accuracy)} m`},()=>{h.textContent='No se pudo leer el GPS. Revisa el permiso de ubicación o escribe las coordenadas.'},{enableHighAccuracy:true,timeout:15000})}catch(e){h.textContent='Este dispositivo no permite leer el GPS aquí. Escribe las coordenadas.'}}
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.dataset.pf){const k=t.dataset.pf;const ph=await filesToPhotos(t.files);photoBuf[k]=t.dataset.multi==='1'?[...photoBuf[k],...ph]:ph.slice(0,1);$('#pv-'+k).innerHTML=photoBuf[k].map(p=>`<img src="${p}" alt="">`).join('');return}
  if(t.dataset.addphoto){if(!can('evidencia'))return;const e=byId('equipos',t.dataset.addphoto);const ph=await filesToPhotos(t.files);e.fotos=[...(e.fotos||[]),...ph];V.gal=e.fotos.length-1;put('equipos',e);render();toast(ph.length+' foto(s) agregada(s)');return}
  if(t.dataset.trphoto){if(!can('editar'))return;const x=byId('trabajadores',t.dataset.trphoto);const ph=await filesToPhotos(t.files);if(ph[0]){x.foto=ph[0];put('trabajadores',x);render()}return}
  if(t.id==='importFile'&&t.files[0]&&can('usuarios')){try{const d=JSON.parse(await t.files[0].text());if(d.app!=='control-campo')throw 0;COLS.forEach(c=>{S[c]=Array.isArray(d[c])?d[c]:[];persist(c)});if(d.config)S.config={...S.config,...d.config};persist('config');go('panel');toast('Respaldo cargado')}catch(e){toast('Ese archivo no es un respaldo de esta app')}t.value=''}
});
document.addEventListener('submit',ev=>{if(ev.target.id==='cfgForm'){ev.preventDefault();if(!can('usuarios'))return;const f=ev.target;S.config.empresa=f.empresa.value||S.config.empresa;S.config.lema=f.lema.value;persist('config');render();toast('Guardado')}});
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{V.q=e.target.value;if(V.q.trim()){V.view='buscar';V.id=null;render()}else go('panel')},200)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('online',()=>{updNet();toast('Conexión recuperada')});
window.addEventListener('offline',()=>{updNet();toast('Sin señal: lo que captures se guarda en el dispositivo')});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==V.view&&NAV.some(n=>n[0]===h))go(h)});

/* ---------- Arranque ---------- */
(async function start(){
  await openDB();
  const has=await idbGet('equipos');
  if(has===undefined){seed()}else{for(const c of COLS)S[c]=(await idbGet(c))||[];S.config={...S.config,...((await idbGet('config'))||{})};if(S.config.empresa==='Topografía y Construcción'){S.config.empresa='LAMBDA';if(S.config.lema==='Proyectos que dejan huella')S.config.lema='Topografía y construcción';persist('config')}S.cola=(await idbGet('cola'))||[]}
  S.usuarios=(await idbGet('usuarios'))||[];await ensureUsers();
  const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))V.view=h;
  let sid=null;try{sid=localStorage.getItem('cc-sesion')}catch(e){}
  U=S.usuarios.find(z=>z.id===sid&&z.activo!==false)||null;
  render();
  try{if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
})();
</script>
</body></html>
